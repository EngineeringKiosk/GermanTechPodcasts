description: "Wir sind netzpolitik.org, das Medium für digitale Freiheitsrechte. In unserem Podcast \"Off/On\" wechseln sich zwei Formate ab: Bei \"Off The Record\" führen wir euch in den Maschinenraum von netzpolitik.org. Wir erzählen, wie unsere Recherchen entstehen, und machen transparent, wie wir arbeiten. Bei \"On The Record\" interviewen wir Menschen, die unsere digitale Gesellschaft prägen."
